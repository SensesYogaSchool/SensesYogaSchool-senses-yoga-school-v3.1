<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff Sign In — Updated | Senses Yoga School</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="living-dream.css?v=20261101-gold-campus"></head><body><header><div class="wrap navbar"><a class="brand" href="index.html"><img src="assets/senses-yoga-logo.png" alt="Senses Yoga School"></a><nav class="nav"><a href="index.html">Discover</a><a href="schools.html">Academics</a><a href="library.html">Library</a></nav></div></header><main><section class="pagehero"><div class="wrap" style="max-width:640px"><div class="eyebrow">Private Staff Access</div><h1>School Administration</h1><p>Sign in to oversee the school's learning environments and approved apprentice records.</p><form id="staff-login"><label for="staff-email">Administrator email</label><input id="staff-email" type="email" autocomplete="username" required style="display:block;width:100%;padding:.8rem;margin:.5rem 0 1rem"><label for="staff-password">Password</label><input id="staff-password" type="password" autocomplete="current-password" required style="display:block;width:100%;padding:.8rem;margin:.5rem 0 1rem"><button class="button" type="submit">Sign in to administration</button></form><p id="staff-status" role="status" aria-live="polite"></p><p>Enrolled apprentice? <a href="apprentice-login.html">Use the apprentice entrance</a>.</p></div></section></main><footer><div class="wrap">Senses Yoga School · Community is our campus.</div></footer><script src="script.js"></script><script>const base='https://gqowglwyumkzyhwxtxng.supabase.co';const key='sb_publishable_bCOv6eCVVhrIlDqR4MdNNA_tVW2fSCv';const form=document.getElementById('staff-login'),status=document.getElementById('staff-status');form.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;status.textContent='Verifying administrator credentials…';try{const response=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('staff-email').value.trim(),password:document.getElementById('staff-password').value})});if(!response.ok){const detail=await response.json().catch(()=>({}));const reason=detail.error_code||detail.code||'http_'+response.status;throw Error('Authentication error: '+reason+'. '+(response.status===400?'Check the email and password.':'Please contact school administration.'));}const session=await response.json();document.getElementById('staff-password').value='';const check=await fetch(base+'/auth/v1/user',{headers:{apikey:key,Authorization:'Bearer '+session.access_token}});if(!check.ok)throw Error('Unable to verify administrator permissions.');const user=await check.json();if(user.app_metadata?.school_role!=='admin')throw Error('This account is not authorized for administration.');sessionStorage.setItem('senses_admin_session',JSON.stringify(session));location.assign('apprentice-admin.html');}catch(err){status.textContent=err.message;}finally{button.disabled=false;}});</script></body></html>
