<script>
(function(){
  var p=(window.location.pathname||'/').toLowerCase().replace(/\/+$/,'');
  var q=window.location.search||'';
  var h=window.location.hash||'';
  var exact={
    '/about':'/about.html',
    '/about/the-vedic-arts':'/schools.html',
    '/about/educational-offerings':'/practice.html',
    '/about/educational-offerings/yoga-for-life':'/practice.html#yoga-for-life',
    '/join-the-community':'/join.html',
    '/join-the-community/volunteer-opportunities':'/volunteer.html',
    '/join-the-community/volunteer-opportunities/applied-initiatives':'/serve.html',
    '/join-the-community/volunteer-opportunities/applied-initiatives/yoga-arts-garden-initiative':'/serve.html#yagi'
  };
  var target=exact[p];
  if(!target){
    if(p.indexOf('vedic')>-1 || p.indexOf('natya')>-1 || p.indexOf('nada')>-1 || p.indexOf('moga')>-1 || p.indexOf('creative-art')>-1) target='/schools.html';
    else if(p.indexOf('yoga-for-life')>-1 || p.indexOf('breathwork')>-1 || p.indexOf('class')>-1 || p.indexOf('practice')>-1) target='/practice.html';
    else if(p.indexOf('garden')>-1 || p.indexOf('yagi')>-1 || p.indexOf('ecology')>-1 || p.indexOf('volunteer')>-1 || p.indexOf('service')>-1 || p.indexOf('applied-initiative')>-1) target='/serve.html';
    else if(p.indexOf('apprent')>-1 || p.indexOf('teacher')>-1 || p.indexOf('certif')>-1 || p.indexOf('leadership')>-1) target='/lead.html';
    else if(p.indexOf('dream')>-1 || p.indexOf('specialized')>-1 || p.indexOf('study')>-1 || p.indexOf('education')>-1 || p.indexOf('learn')>-1) target='/learn.html';
    else if(p.indexOf('partner')>-1 || p.indexOf('organization')>-1 || p.indexOf('workplace')>-1) target='/partner.html';
    else if(p.indexOf('calendar')>-1 || p.indexOf('event')>-1 || p.indexOf('schedule')>-1) target='/calendar.html';
    else if(p.indexOf('resource')>-1 || p.indexOf('library')>-1) target='/resources.html';
    else if(p.indexOf('impact')>-1) target='/impact.html';
    else if(p.indexOf('support')>-1 || p.indexOf('donat')>-1) target='/support.html';
    else if(p.indexOf('about')>-1 || p.indexOf('mission')>-1 || p.indexOf('founder')>-1) target='/about.html';
  }
  if(target){ window.location.replace(target + (target.indexOf('#')>-1 ? '' : h) + q); }
})();
</script>
